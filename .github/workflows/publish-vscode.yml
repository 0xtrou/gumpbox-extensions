name: Publish VSCode Extension

on:
  push:
    tags:
      - "gumpbox-mcp-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter gumpbox-mcp build

      - name: Package .vsix
        run: pnpm --filter gumpbox-mcp package --no-yarn

      - name: Publish to VSCode Marketplace
        run: pnpm --filter gumpbox-mcp publish:marketplace --no-yarn
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to OpenVSX
        run: pnpm --filter gumpbox-mcp publish:openvsx --no-yarn
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Upload .vsix as release asset
        uses: softprops/action-gh-release@v2
        with:
          files: clients/vscode/*.vsix
